[package]
name = "liminal-gui"
version = "0.1.0"
description = "Read-only GUI for Liminal pipeline graphs"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
liminal = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
toml = "0.9.3"
toml_edit = "0.23"
